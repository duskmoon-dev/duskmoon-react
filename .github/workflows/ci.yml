name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint:all

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check changed file formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD -- \
              '*.css' '*.json' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yaml' '*.yml')
          else
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- \
              '*.css' '*.json' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yaml' '*.yml')
          fi

          if (( ${#files[@]} == 0 )); then
            echo "No changed files require Prettier."
            exit 0
          fi

          bun x prettier --check "${files[@]}"

  size:
    name: Bundle Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      - run: bun run --filter "@duskmoon-dev/components" size

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      - run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      - name: Build Next.js Smoke Test
        run: bun run --filter "nextjs-15-smoke" build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  publish-dryrun:
    name: Publish (Dry Run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build:all
      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
      - run: bun run release:dry-run

  composer-browser:
    name: Composer and surface contracts (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      - run: bun x playwright install --with-deps chromium
      - name: Run executable browser fixtures
        shell: bash
        run: |
          bun run --filter "@duskmoon-dev/docs" dev > /tmp/duskmoon-docs.log 2>&1 &
          docs_pid=$!
          trap 'kill "$docs_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4334/components/chat/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4334/components/chat/ > /dev/null
          bun x playwright test test/e2e/chat-composer.test.ts test/e2e/core-surface.test.ts --project chromium --reporter line
